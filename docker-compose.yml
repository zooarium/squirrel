services:
  api:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:-1.26.3}
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    environment:
      - SQUIRREL_ENVIRONMENT=development
      - SQUIRREL_DATABASE_PATH=/app/data/squirrel.db
      - SQUIRREL_LOG_DIR=/app/log
      # Accept keeper-minted impersonation tokens (sysadmin "login as user").
      # Off by default; the secret MUST match keeper's IMPERSONATION_JWT_SECRET.
      # - SQUIRREL_IMPERSONATION_ENABLED=true
      # - SQUIRREL_IMPERSONATION_JWT_SECRET=change-me-to-match-keeper
      # - SQUIRREL_IMPERSONATION_KEEPER_BASE_URL=http://keeper:8080
    restart: always
    mem_limit: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  atlas:
    image: arigaio/atlas
    volumes:
      - .:/app
      - ./data:/data
    working_dir: /app

# No volumes section needed for bind mounts
